<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Sentimentos - Marketing</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        main {
            width: 100%;
            max-width: 700px;
        }
        header {
            margin-bottom: 2rem;
            text-align: center;
        }
        h1 { font-size: 1.75rem; color: var(--primary); margin-bottom: 0.5rem; }
        section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1.5rem;
        }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { opacity: 0.9; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th { font-weight: 600; background-color: #f1f5f9; }
        .badge-positivo { color: #16a34a; font-weight: bold; }
        .badge-negativo { color: #dc2626; font-weight: bold; }
        .badge-neutro { color: #475569; font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Classificador de Comentários</h1>
            <p>Ferramenta de PLN para triagem rápida de feedback de clientes</p>
        </header>

        <section>
            <form method="POST">
                <label for="comentario">Insira o comentário do cliente:</label>
                <textarea id="comentario" name="comentario" required placeholder="Ex: O atendimento foi excelente, adorei o produto!"></textarea>
                <button type="submit">Analisar Sentimento</button>
            </form>
        </section>

        <section>
            <h2>Últimas Análises</h2>
            <table>
                <thead>
                    <tr>
                        <th>Comentário</th>
                        <th>Sentimento</th>
                        <th>Polaridade</th>
                    </tr>
                </thead>
                <tbody>
                    {% if historico %}
                        {% for row in historico %}
                        <tr>
                            <td>{{ row[0] }}</td>
                            <td>
                                <span class="badge-{{ row[1] | lower }}">
                                    {{ row[1] }}
                                </span>
                            </td>
                            <td>{{ row[2] }}</td>
                        </tr>
                        endfor
                    {% else %}
                        <tr>
                            <td colspan="3" style="text-align: center; color: #64748b;">Nenhum comentário analisado ainda.</td>
                        </tr>
                    {% endif %}
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
